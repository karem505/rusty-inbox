name: Flatpak

# Builds the Flatpak for x86_64 and aarch64 and merges both into one signed Flatpak repository.
# On a release tag it attaches both .flatpak bundles to the GitHub Release and publishes the
# repository on GitHub Pages:
#   flatpak install --user https://karem505.github.io/rusty-inbox/rusty-inbox.flatpakref
# A manual run (workflow_dispatch) builds, merges and checks everything but publishes nothing, so a
# test run from a branch can never replace the repository users update from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: flatpak-${{ startsWith(github.ref, 'refs/tags/v') && 'pages' || github.ref }}
  cancel-in-progress: false

env:
  APP_ID: io.github.karem505.rusty-inbox
  SITE: https://karem505.github.io/rusty-inbox

jobs:
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Bundle name
        id: v
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "bundle=rusty-inbox-${VER}-${{ matrix.arch }}.flatpak" >> "$GITHUB_OUTPUT"
      - name: Import the repository signing key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long | grep -c sec
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ steps.v.outputs.bundle }}
          manifest-path: packaging/flatpak/io.github.karem505.rusty-inbox.yml
          arch: ${{ matrix.arch }}
          branch: stable
          gpg-sign: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          restore-cache: true
          upload-artifact: false
      - name: Pack the repository
        run: |
          set -eu
          ls -d repo/objects
          ls -l "${{ steps.v.outputs.bundle }}"
          tar -cf "flatpak-repo-${{ matrix.arch }}.tar" repo
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: |
            ${{ steps.v.outputs.bundle }}
            flatpak-repo-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7

  repository:
    needs: flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: flatpak-*
          merge-multiple: true
      - name: Import the repository signing key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long | grep -c sec
      - name: One signed repository with both architectures
        env:
          KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          set -eu
          ls -l
          ostree --repo=repo init --mode=archive-z2
          for t in flatpak-repo-*.tar; do
            d="${t%.tar}"
            mkdir -p "$d"
            tar -xf "$t" -C "$d"
            ostree --repo=repo pull-local "$d/repo"
            rm -rf "$d" "$t"
          done
          flatpak build-update-repo --gpg-sign="$KEY_ID" --default-branch=stable \
            --title="Rusty Inbox" --homepage=https://github.com/karem505/rusty-inbox repo
          ostree --repo=repo refs | sort
          # the app for both architectures, each commit signed with the repository key
          for a in x86_64 aarch64; do
            ref="app/$APP_ID/$a/stable"
            ostree --repo=repo refs | grep -qx "$ref" || { echo "missing $ref"; exit 1; }
            ostree --repo=repo show "$ref" > show.txt 2>&1 || true
            cat show.txt
            grep -q "Found [1-9] signature" show.txt || { echo "unsigned commit: $ref"; exit 1; }
          done
          rm -f show.txt
      - name: Repository site
        run: |
          set -eu
          mkdir -p _site
          cp -a repo _site/repo
          KEY_B64=$(base64 -w0 packaging/flatpak/repo/rusty-inbox.gpg)
          cp packaging/flatpak/repo/rusty-inbox.gpg _site/rusty-inbox.gpg
          cp app/packaging/icons/rusty-inbox-128.png _site/icon.png
          cat > _site/rusty-inbox.flatpakref <<REF
          [Flatpak Ref]
          Title=Rusty Inbox
          Name=$APP_ID
          Branch=stable
          Url=$SITE/repo/
          SuggestRemoteName=rusty-inbox
          Homepage=https://github.com/karem505/rusty-inbox
          Icon=$SITE/icon.png
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=$KEY_B64
          REF
          cat > _site/rusty-inbox.flatpakrepo <<REPO
          [Flatpak Repo]
          Title=Rusty Inbox
          Url=$SITE/repo/
          Homepage=https://github.com/karem505/rusty-inbox
          Comment=Fast native email client
          Icon=$SITE/icon.png
          DefaultBranch=stable
          GPGKey=$KEY_B64
          REPO
          sed -i 's/^ *//' _site/rusty-inbox.flatpakref _site/rusty-inbox.flatpakrepo
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Rusty Inbox Flatpak repository</title>
          <style>body{font:16px/1.6 system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 20px}code,pre{background:#f2f2f2;padding:2px 6px;border-radius:6px}pre{padding:12px;overflow:auto}</style>
          <h1>Rusty Inbox Flatpak repository</h1>
          <p>Install (the KDE runtime comes from Flathub):</p>
          <pre>flatpak install --user https://karem505.github.io/rusty-inbox/rusty-inbox.flatpakref</pre>
          <p>Updates arrive with <code>flatpak update</code>. Or add the repository:</p>
          <pre>flatpak remote-add --user --if-not-exists rusty-inbox https://karem505.github.io/rusty-inbox/rusty-inbox.flatpakrepo</pre>
          <p><a href="https://github.com/karem505/rusty-inbox">Source and other downloads</a></p>
          HTML
          touch _site/.nojekyll
          du -sh _site _site/repo
          find _site -type f -size +95M -print
      - name: Attach both bundles to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: rusty-inbox-*.flatpak
          fail_on_unmatched_files: true
      - uses: actions/upload-pages-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: _site

  pages:
    needs: repository
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
