[workspace]
resolver = "2"
members = ["crates/rusty-inbox-core", "crates/rusty-inbox-ai", "app"]

[workspace.package]
edition = "2021"
version = "0.1.4"
license = "MIT OR Apache-2.0"
repository = "https://github.com/karem505/rusty-inbox"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"
