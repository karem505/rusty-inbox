[package]
name = "rusty-inbox"
description = "Fast, native email client with a Rust engine and a Qt 6 / QML interface"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
rusty-inbox-core = { path = "../crates/rusty-inbox-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify-rust = "4"
dirs = "6"

[build-dependencies]
cxx-qt-build = "0.10"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
