[package]
name = "rusty-inbox-core"
description = "Mail engine of Rusty Inbox: IMAP sync, SMTP, MIME, threading and a SQLite store"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["email", "imap", "smtp", "mail-client", "sqlite"]
categories = ["email", "network-programming"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
socket2 = { version = "0.6", features = ["all"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
chrono.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-native-certs", "hostname"] }
futures = "0.3"
regex = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
# Thunderbird import: NSS key4.db / logins.json decryption
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes = "0.8"
des = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }

[dev-dependencies]
tempfile = "3"
